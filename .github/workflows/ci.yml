name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Offline only: no secrets are passed, the fake model is the default, the
  # real-model eval test skips itself, and CrewAI's telemetry is off.
  TRIAGE_PROVIDER: fake
  CREWAI_DISABLE_TELEMETRY: "true"
  OTEL_SDK_DISABLED: "true"
  CREWAI_TRACING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest
      - name: README quickstart
        run: |
          uv run triage run --alert fixtures/alerts/high-latency.json --thread-id ci --state-dir "$RUNNER_TEMP/triage"
          uv run triage resume ci --approve --state-dir "$RUNNER_TEMP/triage"
