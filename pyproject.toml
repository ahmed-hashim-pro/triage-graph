[project]
name = "triage-graph"
version = "0.1.0"
description = "Multi-agent incident triage on LangGraph with a code-enforced human approval gate, plus a CrewAI port for comparison."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Hashim" }]
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langgraph-prebuilt==1.1.0",
    "langchain-core==1.6.6",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic==1.7.5"]
# crewai 1.15.23 declares requires-python <3.14.
crewai = ["crewai==1.15.23; python_version < '3.14'"]

[project.scripts]
triage = "triage_graph.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_graph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]
# SIM905: "a b c".split() reads better than a 30-line list literal.
ignore = ["ANN401", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"evals/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
# crewai_port/ and evals/ live at the repo root, outside the installed package.
pythonpath = ["."]
addopts = "-ra"
# CrewAI 1.15.23 triggers these from its own code for options this repo never sets.
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
markers = [
    "real_model: calls a real LLM provider; skipped without an API key",
]
